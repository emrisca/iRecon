[package]
name = "irecon"
default-run = "irecon"
version = "0.4.0"
description = "Learn what you point at, then box it on your live screen"
authors = ["emrisca"]
edition = "2021"

[lib]
name = "irecon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
ort = "2.0.0-rc.15"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12.5", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
xcap = { version = "0.9.8", features = ["wgc"] }

# Graphics Capture is the primary display backend on Windows. It measured 106
# fps against duplication's 53, so it is not optional on the target platform.
[target.'cfg(windows)'.dependencies]
# DirectML is the GPU path on Windows. The CPU provider remains the fallback
# when DirectML cannot register or cannot open the graph.
ort = { version = "2.0.0-rc.15", features = ["directml"] }
windows-capture = "2.0.1"
