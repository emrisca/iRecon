[package]
name = "irecon"
version = "0.1.0"
description = "Learn what you point at, then box it on your live screen"
authors = ["emrisca"]
edition = "2021"

[lib]
name = "irecon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["macos-private-api"] }
xcap = "0.9.8"
